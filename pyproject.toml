[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "password-strength-check"
version = "0.1.0"
description = "Command-line password strength checker with no third-party dependencies"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
pwstrength = "pwstrength.cli:main"

[tool.setuptools.packages.find]
include = ["pwstrength*"]

[tool.setuptools.package-data]
pwstrength = ["data/*.txt"]
